#
# "maxiv distribution" configuration
# it's basically a customization of amd-edf
# which cannot be achieved in local.conf, as the distro conf overrides local.conf
# so here we are
#

require conf/distro/amd-edf.conf

# DISTRO is reset by amd-edf.conf, so we need to put it back
DISTRO = "maxiv"
DISTRO_NAME = "maxiv yocto - based on xilinx amd-edf"
DISTRO_VERSION = "v2025.2"
# also DISTROOVERRIDES was set by amd-edf.conf, so we need to put it back
# note that I enable also all xilinx "amd-edf" overrides, so I get all their standard machinery,
# but the "maxiv" distro lets me override what I want
DISTROOVERRIDES = "poky:poky-altcfg:amd-edf:maxiv"


# hostname is not set here, so it can be set in local.conf
# note that he override used in deployment is:
# hostname:pn-base-files:maxiv
#hostname:pn-base-files = "kalleanka"
#hostname:pn-base-files:amd-edf = "farbrorjoakim"
#hostname:pn-base-files:maxiv = "knaseanka"

# Use the custom MACHINE generated by gen-machine-conf on my custom vivado project
MACHINE ?= "custom-machine"


# Avoid errors in some baremetal configs as these layers may be present
# but are not used.  Note the following lines are optional and can be
# safetly disabled.
SKIP_META_VIRT_SANITY_CHECK = "1"
SKIP_META_SECURITY_SANITY_CHECK = "1"
SKIP_META_TPM_SANITY_CHECK = "1"

########################################################
IMAGE_FSTYPES += "wic"
# I set my wks file in a .bbappend for recipe edf-linux-disk-image
#WKS_FILES = "xilinx-default-sd.wks"
INHERIT += "rm_work"

# watch out! xilinx redefines DISTRO and hostname in sources/meta-amd-edf/conf/distro/amd-edf.conf;
# so I have to override that in my file sources/meta-custom/conf/distro/maxiv.conf
DISTRO = "maxiv"
MAXIV_PRODUCT = "chopsync"
MAXIV_VERSION = "1.2"

# hostname is set in file:
# sources/meta-user/conf/distro/amd-edf.conf, called by sources/meta-custom/conf/distro/maxiv.conf,
# but it doesn't matter, because the override used in deployment
# is hostname:pn-base-files:maxiv, so you can set it here
# hostname:pn-base-files = "pippo"
# hostname:pn-base-files:amd-edf = "pluto"
hostname:pn-base-files:maxiv = "xilinx-zcu106-2025p2"

# static PL bitstream loading is automatic; no need to set it here
# set u-boot to load bitstream 
#BIF_BITSTREAM_ATTR  = "bitstream"
#IMAGE_BOOT_FILES += "${BITSTREAM_PATH}"

# Arm-trusted-firmware debug disabled
DEBUG_ATF = "0"


# kernel settings

KERNEL_CLASSES:append = " kernel-fitimage"
KERNEL_IMAGETYPES:append = " fitImage vmlinux Image.gz"

# opencv is about computer vision: I don't need that
AMD-EDF_IMAGE_COMMON_INSTALL:remove:amd-cortexa53-common = "packagegroup-opencv"
TOOLCHAIN_TARGET_TASK:remove:aarch64 = "packagegroup-opencv"
    
# OpenAMP
#MACHINE_FEATURES += "openamp"
#PREFERRED_PROVIDER_libmetal ?= "libmetal-xlnx"
#PREFERRED_PROVIDER_open-amp ?= "open-amp-xlnx"
#TOOLCHAIN_TARGET_TASK:append:aarch64 = " libmetal-dev open-amp-dev"

#PACKAGECONFIG[libunwind] = "--with-libunwind,--without-libunwind,libunwind,libunwind"


# rootfs settings

INIT_MANAGER = "systemd"

EXTRA_IMAGE_FEATURES = "ssh-server-openssh \
                        hwcodecs \
                        "


PACKAGE_INSTALL = "${IMAGE_INSTALL} \
		kernel-modules \
		bc \
		e2fsprogs-mke2fs \
		ed \
		fpga-manager-script \
		haveged \
		i2c-tools \
		mtd-utils \
		can-utils \
		ethtool \
		nfs-utils \
		openssh \
		openssh-ssh \
		openssh-sftp-server \
		openssh-scp \
		pciutils \
		python3-numpy \
		python3-matplotlib \
		run-postinsts \
		libdfx \
		xrt \
		opencl-headers \
		apache2 \
		libcap-bin \
		udev-extraconf \
		linux-xlnx-udev-rules \
		packagegroup-core-boot \
		python3 \
		python3-math \
		python3-misc \
		python3-mmap \
		python3-html \
		libpython3 \
		tcf-agent \
		bridge-utils \
		netcat \
		tcpdump \
		ntp \
		dosfstools \
		u-boot-tools \
		packagegroup-xilinx-benchmarks \
		packagegroup-networking-stack \
		packagegroup-openamp \
    busybox \
		chopsync-scpi-serv \
		chopsync-webintf \
		"

EXTRA_USERS_PARAMS = "useradd -p '\$6\$xx\$ahhpySCyyDNZJzC/fxpQ5px5b6G5dRZ9GvfuxTo8QxyJ2Cyv7XojadLKwQBJef6MPIMYaTBQrRbYKGSi6c9aA/' maxiv; \
                      usermod -a -G audio,video,input maxiv; \
                     "
EXTRA_USERS_SUDOERS = "maxiv ALL=(ALL) ALL;"
